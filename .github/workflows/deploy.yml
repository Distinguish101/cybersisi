name: Check, build and deploy

# Pull requests into main: typecheck only.
# Push to main: typecheck, then build and push the images to GHCR, run the
# migration Job, roll out the new image and smoke-test the live site.
# Docs-only pushes don't deploy.
#
# Needs two things set up once (see docs/DEPLOY.md):
#   - repository secret KUBE_CONFIG: a base64 kubeconfig for the k3s cluster
#   - a `production` environment (Settings → Environments)
# GHCR login uses the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  SITE: https://cybersis.uk

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # prisma.config.ts reads it when postinstall runs `prisma generate`. Nothing connects.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  build-and-push:
    needs: check
    if: github.event_name == 'push'
    # Native arm64 runner (free for public repos): the Oracle VM is arm64.
    runs-on: ubuntu-24.04-arm
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # Image names must be lowercase (the repo owner is "Distinguish101").
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the app image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the migrate image (builder stage, has the Prisma CLI)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: builder
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image }}:migrate
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    # One deploy at a time, never cancelled halfway.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Namespace, service and ingress are idempotent: applying every time
      # keeps the cluster in step with the files in git.
      - name: Apply namespace, service and ingress
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/ingress.yaml

      # Schema first, then code. If this fails the deploy stops and the old
      # version keeps serving. Migrations must therefore be backwards-compatible.
      - name: Run migrations
        run: |
          kubectl delete job cybersis-migrate -n cybersis --ignore-not-found
          kubectl apply -f k8s/migration-job.yaml
          if ! kubectl wait --for=condition=complete job/cybersis-migrate -n cybersis --timeout=180s; then
            kubectl logs job/cybersis-migrate -n cybersis || true
            exit 1
          fi
          kubectl logs job/cybersis-migrate -n cybersis

      # Applies the whole manifest with the new tag, so env, probe and resource
      # changes in git also reach the cluster.
      - name: Roll out the new image
        run: |
          sed "s|image: ${{ needs.build-and-push.outputs.image }}:.*|image: ${{ needs.build-and-push.outputs.image }}:${{ needs.build-and-push.outputs.tag }}|" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl rollout status deployment/cybersis -n cybersis --timeout=180s

      # Health (process up), the home page, a form page, and one database
      # check (a single ?ready=1 per deploy is fine; on a timer it isn't).
      # It doesn't roll back: with maxUnavailable 0 the old pod served until
      # the new one was ready. A failure here emails you via GitHub.
      - name: Smoke test the live site
        run: |
          for path in /api/health / /get-involved/member "/api/health?ready=1"; do
            url="${SITE}${path}"
            ok=0
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$url" || true)
              echo "$url attempt $attempt: HTTP $code"
              if [ "$code" = "200" ]; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != "1" ]; then
              echo "::error::$url did not return 200 after the deploy"
              exit 1
            fi
          done
