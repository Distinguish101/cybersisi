# Weekly pull requests for out-of-date or vulnerable dependencies. Each runs
# the typecheck (workflows/deploy.yml) before it can be merged.
# Note: npm `allowScripts` approvals in package.json are tied to exact
# versions, so a Prisma bump needs `npm approve-scripts prisma @prisma/engines`.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
