# Local development database. Production uses Neon (same Postgres major version).
services:
  db:
    image: postgres:17
    container_name: cybersis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cybersis
      POSTGRES_PASSWORD: cybersis
      POSTGRES_DB: cybersis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybersis -d cybersis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
