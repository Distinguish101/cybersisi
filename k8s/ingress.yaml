# Traefik (bundled with k3s) routes cybersis.uk to this app. The same Traefik
# already serves IdistinguishR on the same VM; hostnames keep them apart.
#
# The certificate comes from cert-manager's cluster-wide ClusterIssuer
# "letsencrypt-prod", which IdistinguishR's repo already created
# (k8s/cluster-issuer.yaml there). It validates over plain HTTP on port 80,
# so it only issues once DNS for cybersis.uk points at the VM.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cybersis
  namespace: cybersis
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: cybersis-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - cybersis.uk
      secretName: cybersis-tls
  rules:
    - host: cybersis.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cybersis
                port:
                  number: 80
---
# Redirect plain HTTP to HTTPS (permanent).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  namespace: cybersis
spec:
  redirectScheme:
    scheme: https
    permanent: true
