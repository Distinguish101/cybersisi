#   cp k8s/secret.example.yaml k8s/secret.yaml   # git-ignored
#   # fill in the values in an editor
#   kubectl apply -f k8s/namespace.yaml
#   kubectl apply -f k8s/secret.yaml
#   rm k8s/secret.yaml                            # keep the values in a password manager
apiVersion: v1
kind: Secret
metadata:
  name: cybersis-secrets
  namespace: cybersis
type: Opaque
stringData:
  # Neon POOLED url (host contains "-pooler"), used by the app.
  DATABASE_URL: "postgresql://USER:PASSWORD@ep-xxx-pooler.REGION.aws.neon.tech/cybersis?sslmode=require&connect_timeout=15"
  # Neon DIRECT url (no "-pooler"), used only by the migration Job.
  DIRECT_URL: "postgresql://USER:PASSWORD@ep-xxx.REGION.aws.neon.tech/cybersis?sslmode=require&connect_timeout=15"

  # Resend. Leave RESEND_API_KEY empty to skip alert emails (submissions still save).
  RESEND_API_KEY: ""
  # Inbox that gets "{first name} registered interest as a {type}" alerts.
  NOTIFY_EMAIL: "REPLACE_ME"
  # The owner's admin login, for the admin page stage (unused until then).
  ADMIN_EMAIL: "REPLACE_ME"
